name: Scrape PCPartPicker

# Manual trigger only, deliberately.
#
# PCPartPicker sits behind Cloudflare, which refuses GitHub-hosted runner IPs.
# With no residential endpoint in the SCRAPER_PROXY secret, every category comes
# back a "Just a moment..." challenge with zero rows, so a scheduled run cannot
# succeed. It can only produce a weekly red X for a cause nobody can fix from
# inside CI, and a recurring failure everyone learns to ignore is worse than no
# schedule at all.
#
# The note that used to sit here claimed `schedule` never fires on a fork, and
# that the workflow had therefore never run. That was wrong. The weekly cron
# fired on 2026-08-24 and spent 30 minutes retrying 24 categories, 3 attempts
# each, before failing.
#
# Once SCRAPER_PROXY is set, restore the trigger by adding this above
# `workflow_dispatch:` and confirm a manual run goes green first:
#     schedule:
#       - cron: '0 6 * * 1'
on:
  workflow_dispatch:
    inputs:
      endpoints:
        description: 'Space-separated part types, or blank for all'
        required: false
        default: 'memory motherboard cpu'
      max_pages:
        description: 'Cap pages per endpoint (blank for no cap)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full sweep of every category takes hours; a capped run takes minutes.
    timeout-minutes: 330

    steps:
      - name: Validate scraper proxy
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: |
          if [[ -z "$SCRAPER_PROXY" ]]; then
            echo "::error::SCRAPER_PROXY repository secret is missing or empty"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # PCPartPicker sits behind Cloudflare and refuses GitHub-hosted runner
      # IPs. Without a residential endpoint in the SCRAPER_PROXY secret this
      # job fails at the first navigation, by design — a loud failure beats a
      # silently empty dataset.
      # Inputs go through the environment, never interpolated into the shell:
      # `${{ github.event.inputs.* }}` in a run block is a script-injection
      # sink, and SCRAPER_PROXY is in scope here.
      - name: Scrape
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          SCRAPER_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          ENDPOINTS: ${{ github.event.inputs.endpoints }}
        run: |
          npm run scrape -- $ENDPOINTS \
            --sandbox=false --concurrency=2 --delay=2000

      - name: Convert to JSONL and CSV
        if: always()
        run: npm run output -- data-staging/latest

      # Uploaded rather than committed: a run that partially failed should not
      # overwrite good data in ./data without someone looking at the report.
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: data-staging/runs/
          retention-days: 14
